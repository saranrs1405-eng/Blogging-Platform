<!DOCTYPE html>
<html>
<head>
    <title>{{ blog["title"] }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>{{ blog["title"] }}</h1>

    <p>
        <b>Author:</b> {{ blog["username"] }}
    </p>

    <p>
        <small>
            Published on {{ blog["created_at"] }}
        </small>
    </p>

    <hr>

    <p>
        {{ blog["content"] }}
    </p>

    <br>

    {% if session.get("user_id") == blog["author_id"] %}

        <a href="{{ url_for('edit_blog', blog_id=blog['id']) }}">
            Edit Blog
        </a>

        <br><br>

        <a href="{{ url_for('delete_blog', blog_id=blog['id']) }}"
           onclick="return confirm('Are you sure you want to delete this blog?')">
            Delete Blog
        </a>

    {% endif %}

    <br><br>

    <a href="/">Back to Home</a>

</body>
</html>
